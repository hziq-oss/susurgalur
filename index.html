<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salasilah Keluarga - Lengkap Jantina & Garisan</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #080705; color: #f1f1f1; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .top-bar { position: fixed; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); display: flex; align-items: center; gap: 6px; }
        .btn-secondary { background: rgba(20,20,20,0.8); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        #viewport { width: 100%; height: 100%; cursor: grab; position: relative; overflow: hidden; touch-action: none; }
        #viewport:active { cursor: grabbing; }

        #canvasContainer { position: absolute; transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; padding: 100px; min-width: 4000px; min-height: 3000px; }
        #svgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .gen-level { display: flex; gap: 120px; justify-content: center; margin-bottom: 180px; position: relative; z-index: 2; }
        .gen-title { position: absolute; left: -100px; top: 20px; color: #d4af37; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }

        .marriage-unit {
            background: rgba(20, 20, 18, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .person-card { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 80px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(212, 175, 55, 0.1); border: 1px solid #d4af37; color: #d4af37; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; margin-bottom: 4px; }
        .name { font-weight: 600; font-size: 0.8rem; color: #fff; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .badge { font-size: 0.55rem; padding: 2px 5px; border-radius: 4px; margin-top: 2px; text-transform: uppercase; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-divorced { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-main { background: rgba(212, 175, 55, 0.2); color: #d4af37; }

        .spouse-divider { color: #d4af37; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; }
        .card-actions { position: absolute; top: -6px; right: -6px; display: flex; gap: 3px; }
        .card-actions button { background: #111; border: 1px solid #d4af37; color: #d4af37; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; }

        .footer-hint { position: fixed; bottom: 15px; right: 15px; background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 15px; font-size: 0.7rem; color: #aaa; pointer-events: none; z-index: 90; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #121210; border: 1px solid rgba(212, 175, 55, 0.4); padding: 25px; border-radius: 14px; width: 100%; max-width: 380px; color: #fff; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 15px; color: #d4af37; font-size: 1.1rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #1a1916; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-gold" onclick="openModal()"><i class="fa-solid fa-user-plus"></i> Tambah Rekod</button>
        <button class="btn-secondary" onclick="resetData()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
    </div>

    <div id="viewport">
        <div id="canvasContainer">
            <svg id="svgCanvas"></svg>
        </div>
    </div>

    <div class="footer-hint">Sentuh & Heret untuk gerakkan peta</div>

    <!-- Modal -->
    <div id="familyModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Tambah Rekod Keluarga</h2>
            <form id="familyForm" onsubmit="saveData(event)">
                <input type="hidden" id="memberId">
                <div class="form-group">
                    <label>Nama Individu Utama (Kiri)</label>
                    <input type="text" id="husbandName" required placeholder="Contoh: Ayah (L) atau Anak (P)">
                </div>
                <div class="form-group">
                    <label>Jantina Individu Utama</label>
                    <select id="husbandGender">
                        <option value="L">Lelaki (L)</option>
                        <option value="P">Perempuan (P)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Generasi (Gen)</label>
                    <input type="number" id="memberGen" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label>Pilih Ibu/Bapa Asal (Jika Ini Rekod Anak)</label>
                    <select id="parentSelect">
                        <option value="">-- Tiada (Gen 1 Utama) --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sambungkan Salasilah Dari Ibu (Isteri Mana?)</label>
                    <select id="lineageSource">
                        <option value="wife1">Turun dari Isteri 1</option>
                        <option value="wife2">Turun dari Isteri 2</option>
                    </select>
                </div>
                <hr style="border-color:#333; margin: 15px 0;">
                <div class="form-group">
                    <label>Nama Isteri Pertama (P) - Di Kanan</label>
                    <input type="text" id="wife1Name" placeholder="Contoh: Isteri 1 (P)">
                </div>
                <div class="form-group">
                    <label>Status Isteri Pertama</label>
                    <select id="wife1Status">
                        <option value="active">Aktif (Berkahwin)</option>
                        <option value="cerai">Cerai</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nama Isteri Kedua (P) - Di Kanan</label>
                    <input type="text" id="wife2Name" placeholder="Contoh: Isteri 2 (P)">
                </div>
                <div class="form-group">
                    <label>Status Isteri Kedua</label>
                    <select id="wife2Status">
                        <option value="active">Aktif (Berkahwin)</option>
                        <option value="cerai">Cerai</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()" style="color:#ccc; border-color:#555;">Batal</button>
                    <button type="submit" class="btn-gold" style="padding: 10px 16px;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let familyData = JSON.parse(localStorage.getItem('genderFixData')) || [
            { 
                id: "1", 
                husband: "Ayah", 
                husbandGender: "L", 
                gen: 1, 
                parentId: "", 
                lineageSource: "wife1",
                wife1: "Isteri 1", 
                wife1Status: "cerai", 
                wife2: "Isteri 2", 
                wife2Status: "active" 
            },
            { 
                id: "2", 
                husband: "Anak (Gen 2 Perempuan)", 
                husbandGender: "P", 
                gen: 2, 
                parentId: "1", 
                lineageSource: "wife1",
                wife1: "", wife1Status: "active", wife2: "", wife2Status: "active" 
            }
        ];

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('canvasContainer');
        const svgCanvas = document.getElementById('svgCanvas');
        let scale = 1, panX = window.innerWidth / 2 - 200, panY = 80;
        let isDragging = false, startX, startY;

        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        viewport.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateTransform();
        });
        window.addEventListener('touchend', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = e.deltaY < 0 ? scale * 1.1 : scale / 1.1;
            scale = Math.max(0.3, Math.min(scale, 2.5));
            updateTransform();
        }, { passive: false });

        function renderTree() {
            const existingLevels = container.querySelectorAll('.gen-level');
            existingLevels.forEach(el => el.remove());
            svgCanvas.innerHTML = "";

            let gens = {};
            familyData.forEach(m => {
                if (!gens[m.gen]) gens[m.gen] = [];
                gens[m.gen].push(m);
            });

            Object.keys(gens).sort((a,b)=>a-b).forEach(genNum => {
                const row = document.createElement('div');
                row.className = 'gen-level';
                row.innerHTML = `<div class="gen-title">Gen ${genNum}</div>`;

                gens[genNum].forEach(m => {
                    const branch = document.createElement('div');
                    branch.className = 'family-branch';
                    branch.id = `node-${m.id}`;

                    const mainGender = m.husbandGender || "L";
                    const mainIcon = mainGender === 'P' ? 'fa-venus' : 'fa-mars';

                    let wife1HTML = m.wife1 ? `
                        <div class="spouse-divider"><i class="fa-solid fa-ring"></i></div>
                        <div class="person-card" id="wife1-node-${m.id}">
                            <div class="avatar"><i class="fa-solid fa-venus" style="color:#f43f5e"></i></div>
                            <div class="name">${m.wife1}</div>
                            <div class="badge ${m.wife1Status === 'cerai' ? 'badge-divorced' : 'badge-active'}">${m.wife1Status === 'cerai' ? 'Cerai' : 'Aktif'}</div>
                        </div>
                    ` : '';

                    let wife2HTML = m.wife2 ? `
                        <div class="spouse-divider"><i class="fa-solid fa-ring"></i></div>
                        <div class="person-card" id="wife2-node-${m.id}">
                            <div class="avatar"><i class="fa-solid fa-venus" style="color:#f43f5e"></i></div>
                            <div class="name">${m.wife2}</div>
                            <div class="badge ${m.wife2Status === 'cerai' ? 'badge-divorced' : 'badge-active'}">${m.wife2Status === 'cerai' ? 'Cerai' : 'Aktif'}</div>
                        </div>
                    ` : '';

                    branch.innerHTML = `
                        <div class="marriage-unit">
                            <div class="person-card" id="husband-node-${m.id}">
                                <div class="avatar"><i class="fa-solid ${mainIcon}"></i></div>
                                <div class="name">${m.husband}</div>
                                <div class="badge badge-main">${mainGender}</div>
                            </div>
                            ${wife1HTML}
                            ${wife2HTML}
                            <div class="card-actions">
                                <button onclick="editMember('${m.id}')"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteMember('${m.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    row.appendChild(branch);
                });
                container.appendChild(row);
            });

            setTimeout(() => {
                familyData.forEach(m => {
                    if (m.parentId) {
                        const parentUnit = document.getElementById(`node-${m.parentId}`);
                        const childEl = document.getElementById(`node-${m.id}`);

                        if (parentUnit && childEl) {
                            const targetWifeId = m.lineageSource === 'wife2' ? `wife2-node-${m.parentId}` : `wife1-node-${m.parentId}`;
                            let sourceEl = document.getElementById(targetWifeId);
                            
                            if (!sourceEl) {
                                sourceEl = document.getElementById(`husband-node-${m.parentId}`);
                            }

                            const pRect = sourceEl.getBoundingClientRect();
                            const cRect = childEl.getBoundingClientRect();
                            const cRectContainer = container.getBoundingClientRect();

                            const x1 = (pRect.left + pRect.width / 2 - cRectContainer.left) / scale;
                            const y1 = (pRect.bottom - cRectContainer.top) / scale;
                            const x2 = (cRect.left + cRect.width / 2 - cRectContainer.left) / scale;
                            const y2 = (cRect.top - cRectContainer.top) / scale;

                            drawSVGLine(x1, y1, x2, y2);
                        }
                    }
                });
            }, 50);

            updateParentDropdown();
        }

        function drawSVGLine(x1, y1, x2, y2) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const midY = (y1 + y2) / 2;
            const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
            
            path.setAttribute("d", d);
            path.setAttribute("stroke", "#d4af37");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("fill", "none");
            path.setAttribute("opacity", "0.7");
            
            svgCanvas.appendChild(path);
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = "Tambah Rekod Keluarga";
            document.getElementById('familyForm').reset();
            document.getElementById('memberId').value = "";
            document.getElementById('husbandGender').value = "L";
            document.getElementById('familyModal').style.display = "flex";
        }

        function closeModal() { document.getElementById('familyModal').style.display = "none"; }

        function saveData(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value;
            const husband = document.getElementById('husbandName').value;
            const husbandGender = document.getElementById('husbandGender').value;
            const gen = parseInt(document.getElementById('memberGen').value);
            const parentId = document.getElementById('parentSelect').value;
            const lineageSource = document.getElementById('lineageSource').value;
            const wife1 = document.getElementById('wife1Name').value;
            const wife1Status = document.getElementById('wife1Status').value;
            const wife2 = document.getElementById('wife2Name').value;
            const wife2Status = document.getElementById('wife2Status').value;

            if (id) {
                familyData = familyData.map(m => m.id === id ? { ...m, husband, husbandGender, gen, parentId, lineageSource, wife1, wife1Status, wife2, wife2Status } : m);
            } else {
                familyData.push({ id: Date.now().toString(), husband, husbandGender, gen, parentId, lineageSource, wife1, wife1Status, wife2, wife2Status });
            }

            localStorage.setItem('genderFixData', JSON.stringify(familyData));
            closeModal();
            renderTree();
        }

        function editMember(id) {
            const m = familyData.find(item => item.id === id);
            if (!m) return;
            document.getElementById('modalTitle').innerText = "Sunting Rekod";
            document.getElementById('memberId').value = m.id;
            document.getElementById('husbandName').value = m.husband;
            document.getElementById('husbandGender').value = m.husbandGender || "L";
            document.getElementById('memberGen').value = m.gen;
            document.getElementById('parentSelect').value = m.parentId || "";
            document.getElementById('lineageSource').value = m.lineageSource || "wife1";
            document.getElementById('wife1Name').value = m.wife1 || "";
            document.getElementById('wife1Status').value = m.wife1Status || "active";
            document.getElementById('wife2Name').value = m.wife2 || "";
            document.getElementById('wife2Status').value = m.wife2Status || "active";
            document.getElementById('familyModal').style.display = "flex";
        }

        function deleteMember(id) {
            if (confirm("Padam rekod ini?")) {
                familyData = familyData.filter(m => m.id !== id);
                localStorage.setItem('genderFixData', JSON.stringify(familyData));
                renderTree();
            }
        }

        function updateParentDropdown() {
            const sel = document.getElementById('parentSelect');
            sel.innerHTML = `<option value="">-- Tiada (Gen 1 Utama) --</option>`;
            familyData.forEach(m => {
                sel.innerHTML += `<option value="${m.id}">${m.husband} (Gen ${m.gen})</option>`;
            });
        }

        function resetData() {
            if (confirm("Tetapkan semula semua data?")) {
                localStorage.removeItem('genderFixData');
                location.reload();
            }
        }

        updateTransform();
        renderTree();
    </script>
</body>
</html>
