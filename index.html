<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salasilah Keluarga - Mobile Friendly</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #080705; color: #f1f1f1; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .top-bar { position: fixed; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); display: flex; align-items: center; gap: 6px; }
        .btn-secondary { background: rgba(20,20,20,0.8); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        #viewport { width: 100%; height: 100%; cursor: grab; position: relative; overflow: hidden; touch-action: none; }
        #viewport:active { cursor: grabbing; }

        #canvasContainer { position: absolute; transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; padding: 100px 50px; }

        .gen-level { display: flex; gap: 30px; justify-content: center; margin-bottom: 70px; position: relative; }
        .gen-title { position: absolute; left: -80px; top: 30px; color: #d4af37; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }

        .family-branch { display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .marriage-unit {
            background: rgba(20, 20, 18, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            position: relative;
        }

        .person-card { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 80px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(212, 175, 55, 0.1); border: 1px solid #d4af37; color: #d4af37; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; margin-bottom: 4px; }
        .name { font-weight: 600; font-size: 0.8rem; color: #fff; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .badge { font-size: 0.55rem; padding: 2px 5px; border-radius: 4px; margin-top: 2px; text-transform: uppercase; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-divorced { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .spouse-divider { color: #d4af37; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; }

        .card-actions { position: absolute; top: -6px; right: -6px; display: flex; gap: 3px; }
        .card-actions button { background: #111; border: 1px solid #d4af37; color: #d4af37; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; }

        .footer-hint { position: fixed; bottom: 15px; right: 15px; background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 15px; font-size: 0.7rem; color: #aaa; pointer-events: none; z-index: 90; }

        /* Modal Responsif */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #121210; border: 1px solid rgba(212, 175, 55, 0.4); padding: 25px; border-radius: 14px; width: 100%; max-width: 380px; color: #fff; }
        .modal-content h2 { margin-bottom: 15px; color: #d4af37; font-size: 1.1rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #1a1916; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-gold" onclick="openModal()"><i class="fa-solid fa-user-plus"></i> Tambah</button>
        <button class="btn-secondary" onclick="resetData()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
    </div>

    <div id="viewport">
        <div id="canvasContainer"></div>
    </div>

    <div class="footer-hint">Sentuh & Heret untuk gerakkan peta</div>

    <!-- Modal -->
    <div id="familyModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Tambah Ahli Keluarga</h2>
            <form id="familyForm" onsubmit="saveData(event)">
                <input type="hidden" id="memberId">
                <div class="form-group">
                    <label>Nama Penuh</label>
                    <input type="text" id="memberName" required placeholder="Contoh: Ali">
                </div>
                <div class="form-group">
                    <label>Generasi (Gen)</label>
                    <input type="number" id="memberGen" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label>Pilih Ayah / Ibu (Keluarga Asal)</label>
                    <select id="parentSelect">
                        <option value="">-- Tiada (Gen 1 Utama) --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status Perkahwinan</label>
                    <select id="maritalStatus" onchange="toggleSpouse()">
                        <option value="bujang">Bujang</option>
                        <option value="kahwin">Berkahwin (Aktif)</option>
                        <option value="cerai">Pernah Kahwin / Cerai</option>
                    </select>
                </div>
                <div id="spouseBox" style="display:none;">
                    <div class="form-group">
                        <label>Nama Isteri / Pasangan</label>
                        <input type="text" id="spouseName" placeholder="Nama Isteri">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()" style="color:#ccc; border-color:#555;">Batal</button>
                    <button type="submit" class="btn-gold" style="padding: 10px 16px;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let familyData = JSON.parse(localStorage.getItem('mobileFamilyData')) || [
            { id: "1", name: "Hasan", gen: 1, parentId: "", maritalStatus: "kahwin", spouseName: "Siti" },
            { id: "2", name: "Ahmad", gen: 2, parentId: "1", maritalStatus: "kahwin", spouseName: "Fatima" }
        ];

        // Viewport & Touch/Mouse Gestures
        const viewport = document.getElementById('viewport');
        const container = document.getElementById('canvasContainer');
        let scale = 1, panX = window.innerWidth / 2 - 100, panY = 100;
        let isDragging = false, startX, startY;

        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // Sokongan Tetikus (PC)
        viewport.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
        window.addEventListener('mouseup', () => isDragging = false);

        // Sokongan Sentuhan Jari (Telefon / Mobile Touch)
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
            updateTransform();
        });
        window.addEventListener('touchend', () => isDragging = false);

        // Zoom Skrol (PC) & Pinch (Telefon)
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = e.deltaY < 0 ? scale * 1.1 : scale / 1.1;
            scale = Math.max(0.3, Math.min(scale, 2.5));
            updateTransform();
        }, { passive: false });

        // Render Carta
        function renderTree() {
            container.innerHTML = "";
            let gens = {};
            familyData.forEach(m => {
                if (!gens[m.gen]) gens[m.gen] = [];
                gens[m.gen].push(m);
            });

            Object.keys(gens).sort((a,b)=>a-b).forEach(genNum => {
                const row = document.createElement('div');
                row.className = 'gen-level';
                row.innerHTML = `<div class="gen-title">Gen ${genNum}</div>`;

                gens[genNum].forEach(m => {
                    const branch = document.createElement('div');
                    branch.className = 'family-branch';

                    let spouseHTML = '';
                    if (m.maritalStatus !== 'bujang' && m.spouseName) {
                        const isCerai = m.maritalStatus === 'cerai';
                        spouseHTML = `
                            <div class="spouse-divider"><i class="fa-solid fa-ring"></i></div>
                            <div class="person-card">
                                <div class="avatar"><i class="fa-solid fa-user-tie" style="color:#f43f5e"></i></div>
                                <div class="name">${m.spouseName}</div>
                                <div class="badge ${isCerai ? 'badge-divorced' : 'badge-active'}">${isCerai ? 'Cerai' : 'Aktif'}</div>
                            </div>
                        `;
                    }

                    branch.innerHTML = `
                        <div class="marriage-unit">
                            <div class="person-card">
                                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                                <div class="name">${m.name}</div>
                                <div class="badge badge-active">Utama</div>
                            </div>
                            ${spouseHTML}
                            <div class="card-actions">
                                <button onclick="editMember('${m.id}')"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteMember('${m.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    row.appendChild(branch);
                });
                container.appendChild(row);
            });
            updateParentDropdown();
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = "Tambah Ahli Keluarga";
            document.getElementById('familyForm').reset();
            document.getElementById('memberId').value = "";
            document.getElementById('spouseBox').style.display = "none";
            document.getElementById('familyModal').style.display = "flex";
        }

        function closeModal() { document.getElementById('familyModal').style.display = "none"; }
        function toggleSpouse() {
            const val = document.getElementById('maritalStatus').value;
            document.getElementById('spouseBox').style.display = val === 'bujang' ? 'none' : 'block';
        }

        function saveData(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value;
            const name = document.getElementById('memberName').value;
            const gen = parseInt(document.getElementById('memberGen').value);
            const parentId = document.getElementById('parentSelect').value;
            const maritalStatus = document.getElementById('maritalStatus').value;
            const spouseName = document.getElementById('spouseName').value;

            if (id) {
                familyData = familyData.map(m => m.id === id ? { ...m, name, gen, parentId, maritalStatus, spouseName } : m);
            } else {
                familyData.push({ id: Date.now().toString(), name, gen, parentId, maritalStatus, spouseName });
            }

            localStorage.setItem('mobileFamilyData', JSON.stringify(familyData));
            closeModal();
            renderTree();
        }

        function editMember(id) {
            const m = familyData.find(item => item.id === id);
            if (!m) return;
            document.getElementById('modalTitle').innerText = "Sunting Maklumat";
            document.getElementById('memberId').value = m.id;
            document.getElementById('memberName').value = m.name;
            document.getElementById('memberGen').value = m.gen;
            document.getElementById('parentSelect').value = m.parentId || "";
            document.getElementById('maritalStatus').value = m.maritalStatus;
            document.getElementById('spouseName').value = m.spouseName || "";
            toggleSpouse();
            document.getElementById('familyModal').style.display = "flex";
        }

        function deleteMember(id) {
            if (confirm("Padam rekod ini?")) {
                familyData = familyData.filter(m => m.id !== id);
                localStorage.setItem('mobileFamilyData', JSON.stringify(familyData));
                renderTree();
            }
        }

        function updateParentDropdown() {
            const sel = document.getElementById('parentSelect');
            sel.innerHTML = `<option value="">-- Tiada (Gen 1 Utama) --</option>`;
            familyData.forEach(m => {
                sel.innerHTML += `<option value="${m.id}">${m.name} (Gen ${m.gen})</option>`;
            });
        }

        function resetData() {
            if (confirm("Tetapkan semula semua data?")) {
                localStorage.removeItem('mobileFamilyData');
                location.reload();
            }
        }

        updateTransform();
        renderTree();
    </script>
</body>
</html>
