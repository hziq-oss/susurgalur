<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salasilah Keluarga - Profesional Genogram</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #080705; color: #f1f1f1; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .top-bar { position: fixed; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #000; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.8rem; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); display: flex; align-items: center; gap: 5px; }
        .btn-secondary { background: rgba(20,20,20,0.85); border: 1px solid rgba(212, 175, 55, 0.3); color: #d4af37; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
        .btn-danger { background: rgba(20,20,20,0.85); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }

        #viewport { width: 100%; height: 100%; cursor: grab; position: relative; overflow: hidden; touch-action: none; }
        #viewport:active { cursor: grabbing; }

        #canvasContainer { position: absolute; transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; padding: 100px; min-width: 4000px; min-height: 3000px; }
        #svgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .gen-level { display: flex; gap: 140px; justify-content: center; margin-bottom: 200px; position: relative; z-index: 2; }
        .gen-title { position: absolute; left: -100px; top: 20px; color: #d4af37; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }

        .marriage-unit {
            background: rgba(20, 20, 18, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .person-card { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 90px; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(212, 175, 55, 0.1); border: 1px solid #d4af37; color: #d4af37; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; margin-bottom: 4px; }
        
        .name { 
            font-weight: 600; 
            font-size: 0.75rem; 
            color: #fff; 
            max-width: 120px; 
            white-space: normal; 
            word-break: break-word; 
            line-height: 1.2;
        }
        
        .badge { font-size: 0.5rem; padding: 2px 4px; border-radius: 4px; margin-top: 4px; text-transform: uppercase; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-divorced { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-main { background: rgba(212, 175, 55, 0.2); color: #d4af37; }

        .spouse-divider { color: #d4af37; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; }
        .card-actions { position: absolute; top: -6px; right: -6px; display: flex; gap: 3px; }
        .card-actions button { background: #111; border: 1px solid #d4af37; color: #d4af37; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 0.55rem; display: flex; align-items: center; justify-content: center; }

        .empty-state { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center; 
            color: #888; 
            z-index: 50; 
            pointer-events: none; 
            background: rgba(15, 15, 13, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 25px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .empty-state h3 { font-size: 1.2rem; color: #d4af37; margin-bottom: 6px; }

        .footer-hint { position: fixed; bottom: 15px; right: 15px; background: rgba(20, 20, 20, 0.85); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 15px; font-size: 0.7rem; color: #aaa; pointer-events: none; z-index: 90; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #121210; border: 1px solid rgba(212, 175, 55, 0.4); padding: 20px; border-radius: 14px; width: 100%; max-width: 420px; color: #fff; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 12px; color: #d4af37; font-size: 1.05rem; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.75rem; margin-bottom: 3px; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 8px; background: #1a1916; border: 1px solid #333; color: #fff; border-radius: 6px; outline: none; font-size: 0.85rem; }
        .spouse-block { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-gold" onclick="openModal()"><i class="fa-solid fa-user-plus"></i> Tambah</button>
        <button class="btn-secondary" onclick="zoomIn()"><i class="fa-solid fa-magnifying-glass-plus"></i> Zoom +</button>
        <button class="btn-secondary" onclick="zoomOut()"><i class="fa-solid fa-magnifying-glass-minus"></i> Zoom -</button>
        <button class="btn-secondary" onclick="centerView()"><i class="fa-solid fa-crosshairs"></i> Pusatkan</button>
        <button class="btn-secondary" onclick="downloadJSON()"><i class="fa-solid fa-download"></i> Muat Turun</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> Muat Naik</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="uploadJSON(event)">
        <button class="btn-danger" onclick="resetData()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
    </div>

    <div id="viewport">
        <div id="canvasContainer">
            <svg id="svgCanvas"></svg>
        </div>
    </div>

    <div id="emptyMessage" class="empty-state" style="display:none;">
        <h3>Tiada Rekod Salasilah</h3>
        <p>Sila klik butang "Tambah" di atas untuk mula membina carta keluarga.</p>
    </div>

    <div class="footer-hint">Sentuh & Heret untuk gerakkan peta</div>

    <!-- Modal Borang -->
    <div id="familyModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Tambah Rekod Keluarga</h2>
            <form id="familyForm" onsubmit="saveData(event)">
                <input type="hidden" id="memberId">
                <div class="form-group">
                    <label>Nama Individu Utama (Kiri)</label>
                    <input type="text" id="mainName" required placeholder="Contoh: Nama Panjang Penuh">
                </div>
                <div class="form-group">
                    <label>Jantina Individu Utama</label>
                    <select id="mainGender">
                        <option value="L">Lelaki (L)</option>
                        <option value="P">Perempuan (P)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Generasi (Gen)</label>
                    <input type="number" id="memberGen" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label>Pilih Ibu/Bapa Asal (Jika Ini Rekod Anak)</label>
                    <select id="parentSelect">
                        <option value="">-- Tiada (Gen 1 Utama) --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sambung Garisan Keturunan Dari Pihak Mana?</label>
                    <select id="lineageSource">
                        <option value="main">Individu Utama (Kiri)</option>
                        <option value="spouse0">Pasangan 1</option>
                        <option value="spouse1">Pasangan 2</option>
                        <option value="spouse2">Pasangan 3</option>
                        <option value="spouse3">Pasangan 4</option>
                    </select>
                </div>

                <hr style="border-color:#333; margin: 12px 0;">
                <label style="color:#d4af37; font-size:0.8rem; font-weight:600; display:block; margin-bottom:8px;">Senarai Pasangan (Sehingga 4 Orang)</label>
                
                <!-- Pasangan 1 -->
                <div class="spouse-block">
                    <div class="form-group"><label>Nama Pasangan 1</label><input type="text" id="s0_name" placeholder="Nama Pasangan 1"></div>
                    <div class="form-group"><label>Jantina Pasangan 1</label><select id="s0_gender"><option value="P">Perempuan (P)</option><option value="L">Lelaki (L)</option></select></div>
                    <div class="form-group"><label>Status Pasangan 1</label><select id="s0_status"><option value="active">Aktif</option><option value="cerai">Cerai</option></select></div>
                </div>

                <!-- Pasangan 2 -->
                <div class="spouse-block">
                    <div class="form-group"><label>Nama Pasangan 2 (Opsional)</label><input type="text" id="s1_name" placeholder="Nama Pasangan 2"></div>
                    <div class="form-group"><label>Jantina Pasangan 2</label><select id="s1_gender"><option value="P">Perempuan (P)</option><option value="L">Lelaki (L)</option></select></div>
                    <div class="form-group"><label>Status Pasangan 2</label><select id="s1_status"><option value="active">Aktif</option><option value="cerai">Cerai</option></select></div>
                </div>

                <!-- Pasangan 3 -->
                <div class="spouse-block">
                    <div class="form-group"><label>Nama Pasangan 3 (Opsional)</label><input type="text" id="s2_name" placeholder="Nama Pasangan 3"></div>
                    <div class="form-group"><label>Jantina Pasangan 3</label><select id="s2_gender"><option value="P">Perempuan (P)</option><option value="L">Lelaki (L)</option></select></div>
                    <div class="form-group"><label>Status Pasangan 3</label><select id="s2_status"><option value="active">Aktif</option><option value="cerai">Cerai</option></select></div>
                </div>

                <!-- Pasangan 4 -->
                <div class="spouse-block">
                    <div class="form-group"><label>Nama Pasangan 4 (Opsional)</label><input type="text" id="s3_name" placeholder="Nama Pasangan 4"></div>
                    <div class="form-group"><label>Jantina Pasangan 4</label><select id="s3_gender"><option value="P">Perempuan (P)</option><option value="L">Lelaki (L)</option></select></div>
                    <div class="form-group"><label>Status Pasangan 4</label><select id="s3_status"><option value="active">Aktif</option><option value="cerai">Cerai</option></select></div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()" style="color:#ccc; border-color:#555;">Batal</button>
                    <button type="submit" class="btn-gold" style="padding: 8px 14px;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let familyData = JSON.parse(localStorage.getItem('professionalGenogram')) || [];

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('canvasContainer');
        const svgCanvas = document.getElementById('svgCanvas');
        const emptyMessage = document.getElementById('emptyMessage');
        let scale = 1, panX = window.innerWidth / 2 - 150, panY = 100;
        let isDragging = false, startX, startY;

        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // Fungsi Butang Zoom In & Zoom Out
        function zoomIn() {
            scale = Math.min(scale * 1.2, 2.5);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.2, 0.3);
            updateTransform();
        }

        // Fungsi Pusatkan Semula Pintar (Auto-Center)
        function centerView() {
            const cards = container.querySelectorAll('.marriage-unit');
            if (cards.length === 0) {
                panX = window.innerWidth / 2 - 150;
                panY = window.innerHeight / 2 - 100;
                scale = 1;
                updateTransform();
                return;
            }

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const x = (rect.left - containerRect.left) / scale;
                const y = (rect.top - containerRect.top) / scale;
                
                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x + rect.width > maxX) maxX = x + rect.width;
                if (y + rect.height > maxY) maxY = y + rect.height;
            });

            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;

            panX = (window.innerWidth / 2) - (centerX * scale);
            panY = (window.innerHeight / 2) - (centerY * scale);
            
            updateTransform();
        }

        viewport.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateTransform();
        });
        window.addEventListener('touchend', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale = e.deltaY < 0 ? scale * 1.1 : scale / 1.1;
            scale = Math.max(0.3, Math.min(scale, 2.5));
            updateTransform();
        }, { passive: false });

        function renderTree() {
            const existingLevels = container.querySelectorAll('.gen-level');
            existingLevels.forEach(el => el.remove());
            svgCanvas.innerHTML = "";

            if (familyData.length === 0) {
                emptyMessage.style.display = "block";
                updateParentDropdown();
                return;
            } else {
                emptyMessage.style.display = "none";
            }

            let gens = {};
            familyData.forEach(m => {
                if (!gens[m.gen]) gens[m.gen] = [];
                gens[m.gen].push(m);
            });

            Object.keys(gens).sort((a,b)=>a-b).forEach(genNum => {
                const row = document.createElement('div');
                row.className = 'gen-level';
                row.innerHTML = `<div class="gen-title">Gen ${genNum}</div>`;

                gens[genNum].forEach(m => {
                    const branch = document.createElement('div');
                    branch.className = 'family-branch';
                    branch.id = `node-${m.id}`;

                    const mainIcon = m.mainGender === 'P' ? 'fa-venus' : 'fa-mars';

                    let spousesHTML = '';
                    if (m.spouses && m.spouses.length > 0) {
                        m.spouses.forEach((sp, idx) => {
                            if (sp.name) {
                                const spIcon = sp.gender === 'L' ? 'fa-mars' : 'fa-venus';
                                spousesHTML += `
                                    <div class="spouse-divider"><i class="fa-solid fa-ring"></i></div>
                                    <div class="person-card" id="spouse-${m.id}-${idx}">
                                        <div class="avatar"><i class="fa-solid ${spIcon}" style="color:#f43f5e"></i></div>
                                        <div class="name">${sp.name}</div>
                                        <div class="badge ${sp.status === 'cerai' ? 'badge-divorced' : 'badge-active'}">${sp.status === 'cerai' ? 'Cerai' : 'Aktif'}</div>
                                    </div>
                                `;
                            }
                        });
                    }

                    branch.innerHTML = `
                        <div class="marriage-unit">
                            <div class="person-card" id="main-node-${m.id}">
                                <div class="avatar"><i class="fa-solid ${mainIcon}"></i></div>
                                <div class="name">${m.mainName}</div>
                                <div class="badge badge-main">${m.mainGender}</div>
                            </div>
                            ${spousesHTML}
                            <div class="card-actions">
                                <button onclick="editMember('${m.id}')"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteMember('${m.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    row.appendChild(branch);
                });
                container.appendChild(row);
            });

            setTimeout(() => {
                familyData.forEach(m => {
                    if (m.parentId) {
                        const parentUnit = document.getElementById(`node-${m.parentId}`);
                        const childEl = document.getElementById(`node-${m.id}`);

                        if (parentUnit && childEl) {
                            let sourceEl;
                            if (m.lineageSource && m.lineageSource.startsWith('spouse')) {
                                const spouseIdx = m.lineageSource.replace('spouse', '');
                                sourceEl = document.getElementById(`spouse-${m.parentId}-${spouseIdx}`);
                            }
                            
                            if (!sourceEl) {
                                sourceEl = document.getElementById(`main-node-${m.parentId}`);
                            }

                            const pRect = sourceEl.getBoundingClientRect();
                            const cRect = childEl.getBoundingClientRect();
                            const cRectContainer = container.getBoundingClientRect();

                            const x1 = (pRect.left + pRect.width / 2 - cRectContainer.left) / scale;
                            const y1 = (pRect.bottom - cRectContainer.top) / scale;
                            const x2 = (cRect.left + cRect.width / 2 - cRectContainer.left) / scale;
                            const y2 = (cRect.top - cRectContainer.top) / scale;

                            drawSVGLine(x1, y1, x2, y2);
                        }
                    }
                });
            }, 50);

            updateParentDropdown();
        }

        function drawSVGLine(x1, y1, x2, y2) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const midY = (y1 + y2) / 2;
            const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
            
            path.setAttribute("d", d);
            path.setAttribute("stroke", "#d4af37");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("fill", "none");
            path.setAttribute("opacity", "0.7");
            
            svgCanvas.appendChild(path);
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = "Tambah Rekod Keluarga";
            document.getElementById('familyForm').reset();
            document.getElementById('memberId').value = "";
            document.getElementById('mainGender').value = "L";
            document.getElementById('lineageSource').value = "main";
            document.getElementById('familyModal').style.display = "flex";
        }

        function closeModal() { document.getElementById('familyModal').style.display = "none"; }

        function saveData(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value;
            const mainName = document.getElementById('mainName').value;
            const mainGender = document.getElementById('mainGender').value;
            const gen = parseInt(document.getElementById('memberGen').value);
            const parentId = document.getElementById('parentSelect').value;
            const lineageSource = document.getElementById('lineageSource').value;

            let spouses = [];
            for(let i=0; i<4; i++) {
                const name = document.getElementById(`s${i}_name`).value.trim();
                if(name) {
                    spouses.push({
                        name: name,
                        gender: document.getElementById(`s${i}_gender`).value,
                        status: document.getElementById(`s${i}_status`).value
                    });
                }
            }

            if (id) {
                familyData = familyData.map(m => m.id === id ? { ...m, mainName, mainGender, gen, parentId, lineageSource, spouses } : m);
            } else {
                familyData.push({ id: Date.now().toString(), mainName, mainGender, gen, parentId, lineageSource, spouses });
            }

            localStorage.setItem('professionalGenogram', JSON.stringify(familyData));
            closeModal();
            renderTree();
            centerView();
        }

        function editMember(id) {
            const m = familyData.find(item => item.id === id);
            if (!m) return;
            document.getElementById('modalTitle').innerText = "Sunting Rekod";
            document.getElementById('memberId').value = m.id;
            document.getElementById('mainName').value = m.mainName;
            document.getElementById('mainGender').value = m.mainGender || "L";
            document.getElementById('memberGen').value = m.gen;
            document.getElementById('parentSelect').value = m.parentId || "";
            document.getElementById('lineageSource').value = m.lineageSource || "main";

            for(let i=0; i<4; i++) {
                document.getElementById(`s${i}_name`).value = "";
                document.getElementById(`s${i}_gender`).value = "P";
                document.getElementById(`s${i}_status`).value = "active";
            }

            if(m.spouses) {
                m.spouses.forEach((sp, i) => {
                    if(i < 4) {
                        document.getElementById(`s${i}_name`).value = sp.name;
                        document.getElementById(`s${i}_gender`).value = sp.gender || "P";
                        document.getElementById(`s${i}_status`).value = sp.status || "active";
                    }
                });
            }

            document.getElementById('familyModal').style.display = "flex";
        }

        function deleteMember(id) {
            if (confirm("Padam rekod ini?")) {
                familyData = familyData.filter(m => m.id !== id);
                localStorage.setItem('professionalGenogram', JSON.stringify(familyData));
                renderTree();
            }
        }

        function updateParentDropdown() {
            const sel = document.getElementById('parentSelect');
            sel.innerHTML = `<option value="">-- Tiada (Gen 1 Utama) --</option>`;
            familyData.forEach(m => {
                sel.innerHTML += `<option value="${m.id}">${m.mainName} (Gen ${m.gen})</option>`;
            });
        }

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(familyData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "salasilah_keluarga.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function uploadJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    familyData = JSON.parse(e.target.result);
                    localStorage.setItem('professionalGenogram', JSON.stringify(familyData));
                    renderTree();
                    centerView();
                    alert("Data salasilah berjaya dimuat naik!");
                } catch(err) {
                    alert("Format fail tidak sah!");
                }
            };
            reader.readAsText(file);
        }

        function resetData() {
            if (confirm("Padam semua data dan mula kosong?")) {
                localStorage.removeItem('professionalGenogram');
                familyData = [];
                renderTree();
            }
        }

        updateTransform();
        renderTree();
    </script>
</body>
</html>
